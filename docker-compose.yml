services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3008"
    environment:
      PORT: "3008"
      TZ: America/Sao_Paulo
      NOTIFY_TIMES: "08:00,12:00,17:00,21:00"
      PUBLIC_URL: https://amor.chatia.qzz.io
      AI_PROVIDER: groq
      AI_MODEL: qwen/qwen3.8-27b
      VAPID_SUBJECT: mailto:amor@chatia.qzz.io
    volumes:
      - nosso-dia-data:/app/server/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3008/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  nosso-dia-data:
